[project]
name = "ml-playground"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Cian Hughes", email = "chughes000@gmail.com" }]
dependencies = [
    "numpy>=2.0.1",
    "pandas>=2.2.2",
    "matplotlib>=3.9.1",
    "plotly>=5.23.0",
    "tqdm>=4.66.4",
    "scikit-learn>=1.5.1",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "xgboost>=2.1.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true
